<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TISO — Kích hoạt bản quyền</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <link rel="stylesheet" href="control.css">
</head>
<body class="license-locked">

<!-- Trang riêng cho máy chưa có bản quyền. Bridge chỉ trả control.html khi license
     hợp lệ, nên giao diện vận hành không hề tồn tại trong trang này. -->
<div id="license-gate" class="license-gate" role="dialog" aria-modal="true" aria-labelledby="license-gate-title">
    <div class="license-card">
        <div class="license-head">
            <img src="/favicon.svg" alt="TISO">
            <div>
                <h2 id="license-gate-title">Kích hoạt bản quyền TISO</h2>
                <p id="license-message">Đang kiểm tra bản quyền…</p>
            </div>
        </div>

        <div class="license-device">
            <div><span>Thiết bị</span><b id="license-device">—</b></div>
            <div><span>Địa chỉ MAC</span><b id="license-mac">—</b></div>
        </div>

        <section class="license-step">
            <div class="license-step-head"><span class="license-step-index">1</span><b>Chọn gói và gửi mã</b></div>
            <div class="field">
                <label for="license-duration">Gói thời hạn</label>
                <select id="license-duration"></select>
            </div>
            <button id="license-request" class="btn primary full">Gửi mã về email người bán</button>
            <p id="license-request-note" class="license-note">Mã được gửi tới hộp thư quản trị, không hiển thị tại đây. Hãy liên hệ người bán để nhận mã.</p>
        </section>

        <section class="license-step">
            <div class="license-step-head"><span class="license-step-index">2</span><b>Nhập mã kích hoạt</b></div>
            <div class="field">
                <label for="license-key">Mã kích hoạt</label>
                <input id="license-key" type="text" inputmode="latin" autocomplete="off" spellcheck="false" placeholder="XXXX-XXXX-XXXX">
            </div>
            <button id="license-activate" class="btn primary full" disabled>Kích hoạt</button>
            <p id="license-activate-note" class="license-note"></p>
        </section>
    </div>
</div>

<div id="toast-stack" class="toast-stack" aria-live="polite"></div>
<script src="js/license.js"></script>
</body>
</html>
